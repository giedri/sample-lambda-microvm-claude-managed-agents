AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Claude Self-Hosted Sandboxes on AWS Lambda MicroVMs. Launches one isolated
  MicroVM per session via an event-driven webhook control plane.

Parameters:
  ProjectName:
    Type: String
    Default: claude-microvm-sandbox
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,40}[a-z0-9]$"
    Description: Lower-case name prefix for created resources (S3 + roles).

  ImageNamePrefix:
    Type: String
    Default: claude-self-hosted-worker
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9-_]{0,62}$"
    Description: MicroVM image name prefix; build logs go to /aws/lambda/microvms/<image-name>.

  AnthropicEnvironmentId:
    Type: String
    Description: The Claude self_hosted environment id (env_...).

  MicroVmImageIdentifier:
    Type: String
    Default: claude-self-hosted-worker
    Description: Name of the built MicroVM image the launcher runs (resolved to a full ARN below).

  # --- Auth mode: set EXACTLY ONE of EnvironmentKeyParamName (first-party
  # Claude API, bearer environment key) or AnthropicAwsWorkspaceId (Claude
  # Platform on AWS, SigV4). ---------------------------------------------------
  EnvironmentKeyParamName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/.+$"
    Description: >-
      FIRST-PARTY MODE (api.anthropic.com). Name of the SSM Parameter Store
      SecureString holding the Anthropic environment key. CloudFormation cannot
      create SecureString parameters, so create it out-of-band after deploy with
      `aws ssm put-parameter --type SecureString`. Leave empty when using
      Claude Platform on AWS.

  AnthropicAwsWorkspaceId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^wrkspc_[a-zA-Z0-9]+$"
    Description: >-
      CLAUDE PLATFORM ON AWS MODE. Workspace id (wrkspc_...), sent by the worker
      as the anthropic-workspace-id header. The MicroVM authenticates to the
      aws-external-anthropic gateway with SigV4, so no environment key or other
      secret is needed on the VM. Leave empty when using the first-party API.

  AnthropicAccessRoleArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/.+$"
    Description: >-
      CLAUDE PLATFORM ON AWS MODE, cross-account only. ARN of the role in the
      SUBSCRIBED account that carries AnthropicSelfHostedEnvironmentAccess (plus
      sts:GetWebIdentityToken/TagGetWebIdentityToken) and trusts the MicroVM
      execution role — create it with src/scripts/create-anthropic-access-role.sh.
      Leave empty if this stack's account is itself subscribed (the execution
      role then gets the managed policy directly).

  SigningParamName:
    Type: String
    Default: /claude-microvm-sandbox/anthropic-webhook-signing-secret
    Description: >-
      Name of the SSM Parameter Store SecureString holding the Anthropic webhook
      signing secret (whsec_...). Create it out-of-band after deploy with
      `aws ssm put-parameter --type SecureString`.

Rules:
  ExactlyOneAuthMode:
    Assertions:
      - Assert: !Or
          - !And
            - !Not [!Equals [!Ref EnvironmentKeyParamName, ""]]
            - !Equals [!Ref AnthropicAwsWorkspaceId, ""]
          - !And
            - !Equals [!Ref EnvironmentKeyParamName, ""]
            - !Not [!Equals [!Ref AnthropicAwsWorkspaceId, ""]]
        AssertDescription: >-
          Set exactly one of EnvironmentKeyParamName (first-party Claude API) or
          AnthropicAwsWorkspaceId (Claude Platform on AWS).
      # The access role only makes sense in AWS mode — reject it alongside the
      # environment key so first-party deploys never carry an unused (but
      # exercisable) cross-account sts:AssumeRole grant.
      - Assert: !Or
          - !Equals [!Ref AnthropicAccessRoleArn, ""]
          - !Not [!Equals [!Ref AnthropicAwsWorkspaceId, ""]]
        AssertDescription: >-
          AnthropicAccessRoleArn requires AnthropicAwsWorkspaceId (Claude
          Platform on AWS mode); it cannot be combined with
          EnvironmentKeyParamName.

Conditions:
  # First-party mode: worker fetches the environment key from SSM.
  UseEnvironmentKey: !Not [!Equals [!Ref EnvironmentKeyParamName, ""]]
  # Claude Platform on AWS, cross-account: worker assumes a role in the
  # subscribed account.
  UseCrossAccountRole: !Not [!Equals [!Ref AnthropicAccessRoleArn, ""]]
  # Claude Platform on AWS, same-account: this account is subscribed; the
  # execution role calls the gateway directly.
  UseDirectAwsAuth: !And
    - !Equals [!Ref EnvironmentKeyParamName, ""]
    - !Equals [!Ref AnthropicAccessRoleArn, ""]

Globals:
  Function:
    Runtime: python3.14
    Architectures: [arm64]
    Timeout: 30
    # Lambda CPU scales with memory. The launcher imports anthropic (+ pydantic,
    # httpx) for webhook verification; at 128 MB the cold-start import alone can
    # exceed the timeout. 1024 MB gives ~1 vCPU so cold init is a few seconds.
    MemorySize: 1024

Resources:
  # --- Launcher Lambda + webhook API --------------------------------------
  LauncherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-launcher"
      CodeUri: src/functions/
      Handler: launcher.handler
      Environment:
        Variables:
          ANTHROPIC_ENVIRONMENT_ID: !Ref AnthropicEnvironmentId
          # RunMicroVm requires the full image ARN, not a bare name. Build it
          # from the configured name + this account/region.
          MICROVM_IMAGE_IDENTIFIER: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${MicroVmImageIdentifier}"
          # Auth mode passthrough — the launcher forwards whichever of these is
          # configured into the dispatch payload, and the worker picks its auth
          # path from what it receives. First-party mode: the SSM parameter
          # *name* (a reference, not the key). AWS mode: workspace id and, for
          # cross-account, the role the worker assumes. None are secrets.
          ENVIRONMENT_KEY_PARAM_NAME:
            !If [UseEnvironmentKey, !Ref EnvironmentKeyParamName, !Ref "AWS::NoValue"]
          ANTHROPIC_AWS_WORKSPACE_ID:
            !If [UseEnvironmentKey, !Ref "AWS::NoValue", !Ref AnthropicAwsWorkspaceId]
          ANTHROPIC_ACCESS_ROLE_ARN:
            !If [UseCrossAccountRole, !Ref AnthropicAccessRoleArn, !Ref "AWS::NoValue"]
          MICROVM_EXECUTION_ROLE_ARN: !GetAtt MicroVmExecutionRole.Arn
          # Webhook signature verification happens in-process (no API GW authorizer).
          SIGNING_PARAM_NAME: !Ref SigningParamName
          # DynamoDB table backing durable launch dedupe (Powertools Idempotency,
          # keyed on the SESSION id with a short TTL): every agent turn fires
          # another run_started webhook, and the live VM serves it instead of a
          # new launch. See SESSION_DEDUPE_TTL_SECONDS in shared/constants.py.
          IDEMPOTENCY_TABLE: !Ref IdempotencyTable
      Policies:
        # Read only the signing-secret SSM SecureString, scoped to its ARN, plus
        # kms:Decrypt for the SecureString KMS key. The default aws/ssm key ARN
        # isn't known at template time, so Resource is "*" but bounded to SSM
        # (kms:ViaService) AND to this one parameter (kms:EncryptionContext:
        # PARAMETER_ARN), so the launcher can only decrypt the signing secret.
        - Statement:
            - Effect: Allow
              Action: "ssm:GetParameter"
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SigningParamName}"
            - Effect: Allow
              Action: "kms:Decrypt"
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
                  kms:EncryptionContext:PARAMETER_ARN: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SigningParamName}"
        # MicroVM-specific actions have no SAM policy template — explicit
        # least-privilege statements (all confirmed against the deployed service):
        - Statement:
            # The IAM action is lambda:RunMicroVm even though the API operation
            # is named RunMicrovm (confirmed by the service's 403).
            - Effect: Allow
              Action:
                - "lambda:RunMicroVm"
              Resource: "*"
            # PassRole for the MicroVM execution role. No iam:PassedToService
            # condition — the MicroVM service passes the role to a principal that
            # isn't lambda.amazonaws.com, which that condition would deny.
            - Effect: Allow
              Action: "iam:PassRole"
              Resource: !GetAtt MicroVmExecutionRole.Arn
            # RunMicroVm attaches the AWS-managed network connectors; the caller
            # must be allowed to pass them.
            - Effect: Allow
              Action: "lambda:PassNetworkConnector"
              Resource:
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:ALL_INGRESS"
                - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:INTERNET_EGRESS"
            # Durable idempotency store (Powertools Idempotency). Exactly the four
            # item actions the utility needs — least-privilege, scoped to the table.
            - Effect: Allow
              Action:
                - "dynamodb:GetItem"
                - "dynamodb:PutItem"
                - "dynamodb:UpdateItem"
                - "dynamodb:DeleteItem"
              Resource: !GetAtt IdempotencyTable.Arn
      Events:
        Webhook:
          Type: Api
          Properties:
            RestApiId: !Ref WebhookApi
            Path: /webhook
            Method: POST
            # Edge request validation: reject malformed bodies before invoking
            # the launcher. This is request HYGIENE, not authentication — anyone
            # can send a schema-valid body, so the launcher still HMAC-verifies
            # the raw body. ValidateBody only inspects (does not alter) the body,
            # so the raw-bytes signature stays intact. Validates STRUCTURE only,
            # not data.type values (see the Models note on WebhookApi).
            RequestModel:
              Model: AnthropicWebhookEvent
              Required: true
              ValidateBody: true
              ValidateParameters: false

  # Explicit API so we control the name and stage. AuthorizationType is NONE:
  # the launcher verifies the webhook signature in-process (a REQUEST authorizer
  # never receives the body needed to verify the HMAC).
  WebhookApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${ProjectName}-webhook-api"
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true
      Models:
        AnthropicWebhookEvent:
          $schema: "http://json-schema.org/draft-04/schema#"
          type: object
          required: [type, id, created_at, data]
          properties:
            type:
              type: string
            id:
              type: string
            created_at:
              type: string
            data:
              type: object
              required: [type, id]
              properties:
                type:
                  type: string
                id:
                  type: string

  # --- WAF (regional WebACL on the webhook REST API) ----------------------
  # Defense-in-depth for the public webhook endpoint. Like request validation,
  # this is NOT authentication — the launcher's HMAC signature check remains the
  # only thing that proves a request is genuinely from Anthropic. WAF adds
  # managed protections (OWASP/known-bad/IP-reputation) plus a per-IP rate limit
  # so the endpoint can't be cheaply flooded. Scope must be REGIONAL (REST API).
  WebhookWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${ProjectName}-webhook-web-acl"
      Scope: REGIONAL
      Description: !Sub "WAF WebACL for the ${ProjectName} webhook REST API"
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${ProjectName}-webhook-web-acl"
      Rules:
        # AWS managed Common Rule Set (OWASP: XSS, path traversal, LFI/RFI, etc.).
        # BLOCK by default. Unlike a large-payload API, our webhook body is a tiny
        # fixed envelope (already size-bounded by request validation), so we do
        # NOT override SizeRestrictions_BODY to Count — an oversized body here is
        # anomalous and should be blocked.
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-webhook-common-rules"

        # Known Bad Inputs — exploit signatures (host-header injection, JNDI/
        # lookup payloads, malformed requests). No legitimate webhook matches, so
        # BLOCK by default.
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-webhook-bad-inputs"

        # SQL injection signatures. The launcher has no SQL surface, so this is
        # pure defense-in-depth on a public endpoint; BLOCK by default.
        - Name: AWSManagedRulesSQLiRuleSet
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesSQLiRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-webhook-sqli"

        # Amazon IP reputation list — blocks source IPs on AWS threat-intel
        # lists. BLOCK by default.
        - Name: AWSManagedRulesAmazonIpReputationList
          Priority: 4
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-webhook-ip-reputation"

        # Per-IP rate limit on the webhook path. The webhook fires once per
        # AGENT TURN (not per session), and Anthropic delivers from a small
        # shared egress-IP pool, so the limit must absorb aggregate turn volume
        # across all concurrent sessions — sustained 403s here would trip
        # Anthropic's ~20-consecutive-failure auto-disable of the endpoint.
        # 1000 requests / 5 min per IP covers bursty multi-session traffic while
        # still capping floods. BLOCK directly — it's our own threshold, not a
        # managed-rule false-positive risk. The signature check still
        # authenticates; this just caps flooding.
        - Name: RateLimitWebhookPerIP
          Priority: 5
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 1000
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /webhook
                  FieldToMatch:
                    UriPath: {}
                  PositionalConstraint: STARTS_WITH
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "${ProjectName}-webhook-rate-limit"

  # WAF logging to CloudWatch Logs. The log group name MUST start with
  # "aws-waf-logs-" or WAFv2 rejects it as a logging destination.
  WebhookWebACLLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "aws-waf-logs-${ProjectName}-webhook"
      RetentionInDays: 30

  WebhookWebACLLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebhookWebACL.Arn
      LogDestinationConfigs:
        - !GetAtt WebhookWebACLLogGroup.Arn

  # Associate the WebACL with the REST API's prod stage. WAFv2 associations are
  # per-stage; we have only the prod stage, so this covers all API traffic.
  # DependsOn the SAM-generated stage (WebhookApiprodStage) so the association
  # never races stage creation on a fresh deploy. The !Sub ARN alone only
  # depends on the RestApi.
  WebhookWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: WebhookApiprodStage
    Properties:
      ResourceArn: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${WebhookApi}/stages/prod"
      WebACLArn: !GetAtt WebhookWebACL.Arn

  # --- Idempotency store ---------------------------------------------------
  # Durable launch dedupe (Powertools Idempotency), keyed on SESSION id with a
  # short TTL (SESSION_DEDUPE_TTL_SECONDS): every agent turn emits another
  # run_started webhook, so per-event dedupe would launch one VM per turn.
  # Anthropic retries on ANY non-2xx (and ~20 consecutive failures auto-disable
  # the endpoint), and deliveries can arrive concurrently — this table makes
  # "one MicroVM per session within the TTL" durable across cold starts and
  # concurrent instances.
  #
  # Powertools schema: partition key `id` (string), item TTL on `expiration`.
  # PAY_PER_REQUEST suits the very low, bursty webhook volume (no capacity to
  # plan). The data is transient dedup state, so the table is disposable with
  # the stack (DeletionPolicy: Delete).
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${ProjectName}-idempotency"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiration
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # --- Secrets ------------------------------------------------------------
  # SecureString parameters live in SSM Parameter Store. CloudFormation cannot
  # create SecureStrings (AWS::SSM::Parameter supports only String/StringList),
  # so they are NOT declared here — create them out-of-band after deploy with
  # `aws ssm put-parameter --type SecureString` (see README): the webhook
  # signing secret always (SigningParamName), and the environment key only in
  # first-party mode (EnvironmentKeyParamName). On Claude Platform on AWS the
  # worker authenticates with SigV4 — no environment key exists.

  # --- MicroVM execution role ---------------------------------------------
  # Assumed by the MicroVM at run time. Auth-mode dependent (see Conditions):
  # first-party — the worker reads the environment key from SSM as this role;
  # AWS same-account — the worker SigV4-signs gateway requests as this role;
  # AWS cross-account — the worker sts:AssumeRole's into AnthropicAccessRoleArn
  # and signs with the assumed credentials. In the AWS modes no secret ever
  # transits the launcher, the launch configuration, or the VM.
  MicroVmExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-microvm-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
      # Same-account Claude Platform on AWS: the execution role calls the
      # gateway directly, so it carries the Anthropic managed policy itself.
      ManagedPolicyArns:
        !If
          - UseDirectAwsAuth
          - - !Sub "arn:${AWS::Partition}:iam::aws:policy/AnthropicSelfHostedEnvironmentAccess"
          - !Ref "AWS::NoValue"
      Policies:
        # First-party mode: read only the environment-key SSM SecureString.
        - !If
            - UseEnvironmentKey
            - PolicyName: read-environment-key
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action: "ssm:GetParameter"
                    Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnvironmentKeyParamName}"
                  # kms:Decrypt for the SecureString KMS key, bounded to SSM and
                  # to this one parameter via the PARAMETER_ARN encryption context.
                  - Effect: Allow
                    Action: "kms:Decrypt"
                    Resource: "*"
                    Condition:
                      StringEquals:
                        kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
                        kms:EncryptionContext:PARAMETER_ARN: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${EnvironmentKeyParamName}"
            - !Ref "AWS::NoValue"
        # Claude Platform on AWS, cross-account: assume the access role in the
        # subscribed account (which carries the Anthropic managed policy) and
        # SigV4-sign gateway requests with the assumed credentials.
        - !If
            - UseCrossAccountRole
            - PolicyName: assume-anthropic-access-role
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action: "sts:AssumeRole"
                    Resource: !Ref AnthropicAccessRoleArn
            - !Ref "AWS::NoValue"
        # Same-account Claude Platform on AWS: the gateway exchanges the SigV4
        # identity for a web-identity token; the managed policy above does not
        # include these STS actions.
        - !If
            - UseDirectAwsAuth
            - PolicyName: allow-get-web-identity-token
              PolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Action:
                      - "sts:GetWebIdentityToken"
                      - "sts:TagGetWebIdentityToken"
                    Resource: !Sub "arn:${AWS::Partition}:sts::${AWS::AccountId}:self"
            - !Ref "AWS::NoValue"
        - PolicyName: self-terminate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The in-VM worker calls TerminateMicrovm on itself when the
              # session finishes to release compute immediately (the idle policy
              # is the fallback). MicroVM ids are assigned at run time, so the
              # resource can't be scoped to "self" ahead of time. Trade-off:
              # agent code runs in the VM with this role's credentials, so a
              # malicious prompt could terminate ANOTHER MicroVM in this
              # account/region if it learns that VM's id (no List* is granted,
              # so ids can't be enumerated) — availability-only blast radius,
              # bounded to this stack's own sandboxes. Scope this down if the
              # service adds a self-referencing condition key.
              - Effect: Allow
                Action: "lambda:TerminateMicrovm"
                Resource: "*"
        - PolicyName: runtime-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/${ImageNamePrefix}*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/${ImageNamePrefix}*:*"

  # --- MicroVM image build prerequisites ----------------------------------
  # These support building the MicroVM image (a separate CLI step), not the
  # launcher Lambda — SAM does not manage them, they are plain resources.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-build-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - "sts:AssumeRole"
              - "sts:TagSession"
      Policies:
        - PolicyName: artifact-bucket-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
        - PolicyName: build-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/${ImageNamePrefix}*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/${ImageNamePrefix}*:*"

Outputs:
  WebhookUrl:
    Description: Register this URL as the Anthropic webhook endpoint.
    Value: !Sub "https://${WebhookApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod/webhook"
  LauncherFunctionArn:
    Description: The launcher Lambda function ARN.
    Value: !GetAtt LauncherFunction.Arn
  ArtifactBucketName:
    Description: S3 bucket for the MicroVM image source (app.zip).
    Value: !Ref ArtifactBucket
  BuildRoleArn:
    Description: Build role ARN passed to create-microvm-image.
    Value: !GetAtt BuildRole.Arn
  MicroVmExecutionRoleArn:
    Description: Execution role the MicroVM assumes (reads the environment key in first-party mode; SigV4-signs Claude Platform on AWS requests in AWS mode).
    Value: !GetAtt MicroVmExecutionRole.Arn
  SigningParamName:
    Description: Create this SSM SecureString parameter with the Anthropic webhook signing secret.
    Value: !Ref SigningParamName
  EnvironmentKeyParamName:
    Condition: UseEnvironmentKey
    Description: Create this SSM SecureString parameter with the Anthropic environment key (first-party mode).
    Value: !Ref EnvironmentKeyParamName
